packages:
  - 'libs/*'
  - 'apps/*'

# Security overrides for transitive dependencies pinned to vulnerable versions.
# Remove an entry once the upstream range moves past the patched version on its
# own. brace-expansion additionally carries a patch — see `patchedDependencies`
# at the bottom of this file.
overrides:
  # GHSA-gcfj-64vw-6mp9, GHSA-7q8q-rj6j-mhjq, GHSA-mmx7-hfxf-jppx,
  # GHSA-f4gw-2p7v-4548, GHSA-xj6q-8x83-jv6g — pinned to 1.16.x by nx.
  axios: '^1.20.0'
  # GHSA-q2hr-2g5m-vwhr and the earlier expansion DoS advisories require
  # 5.0.12. Legacy minimatch 3.x still calls require('brace-expansion') as a
  # function, so retain the callable CommonJS and ESM default exports. Pin the
  # version exactly to keep the compatibility patch attached on every install.
  # Move the pin and regenerate the patch together for future security fixes.
  brace-expansion: '5.0.12'
  # Patched releases for the remaining Dependabot advisories. Keep old
  # minimatch 3.x consumers on their callable API; 7+ use the named API.
  'minimatch@>=7 <11.0.1': '^11.0.1'
  nx: '23.2.1'
  follow-redirects: '^1.16.2'
  smol-toml: '^1.9.0'
  katex: '^0.18.2'
  piscina: '^4.9.4'
  '@xhmikosr/decompress': '^11.1.4'
  js-yaml@4: '^4.3.2'
  baseline-browser-mapping: '^2.11.0'
  browserslist: '^4.28.7'
  # GHSA-v422-hmwv-36x6 / CVE-2026-12590 — invalid `limit` silently disables
  # size enforcement. Only the 1.x line is affected, via nx's express 4.x. Keep
  # this capped below 2.0.0: express 4.x cannot take body-parser 2.x, and a bare
  # '>=1.20.6' resolves to the 2.x line.
  body-parser@1: '^1.20.6'

allowBuilds:
  '@swc/core': true
  esbuild: true
  node-pty: true
  nx: true

patchedDependencies:
  brace-expansion@5.0.12: patches/brace-expansion@5.0.12.patch
